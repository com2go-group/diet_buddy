# All onboarding questions with simple answers (lose fat, 82 → 70 kg), ending on the plan overview.
appId: com.com2go.dietbuddy
---
- assertVisible: 'Tell us about yourself'
- tapOn: 'Female'
- tapOn: 'Continue'
# Health-data consent (required); the optional coach-insights checkbox stays unticked.
- assertVisible: 'Your health data'
- tapOn: 'I agree to DietBuddy processing my health data for these purposes.'
- tapOn: 'Continue'
- assertVisible: 'Current measurements'
- tapOn:
    id: 'Current Weight'
- inputText: '82'
- tapOn:
    id: 'Height'
- inputText: '168'
- hideKeyboard
- tapOn: 'Continue'
- assertVisible: 'What are your goals?'
- tapOn: 'Lose Fat'
- tapOn: 'Continue'
- assertVisible: 'What’s your goal weight?'
- tapOn:
    id: 'Goal weight'
- inputText: '70'
- hideKeyboard
- tapOn: 'Continue'
- assertVisible: 'How fast do you want to lose?'
- tapOn: 'Continue'
- assertVisible: 'By when?'
- tapOn: 'Continue'
- assertVisible: 'What are you looking to achieve?'
- tapOn: 'Improve health'
- tapOn: 'Continue'
- assertVisible: 'Activity level'
- tapOn: 'Active'
- tapOn: 'Continue'
- assertVisible: 'Training frequency'
- tapOn: '2–3 days'
- tapOn: 'Continue'
- assertVisible: 'Dietary preferences'
- tapOn: 'No preference'
- tapOn: 'Continue'
- assertVisible: 'Dietary restrictions'
- tapOn: 'Continue'
- assertVisible: 'Foods to avoid'
- tapOn: 'Continue'
- assertVisible: 'Allergies'
- tapOn: 'Continue'
- assertVisible: 'Connect health apps'
- tapOn: 'Skip for now'
- assertVisible: 'Connect your devices'
- tapOn: 'Skip for now'
- assertVisible: 'Your AI Plan'
- assertVisible: '.*not medical advice.*'
- tapOn: 'Start My Journey.*'
