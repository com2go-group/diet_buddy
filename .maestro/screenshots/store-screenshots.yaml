# Store screenshots on a device or simulator (docs/store/screenshots/README.md). Sign in with a
# Premium demo account that has a few weeks of data:
#   maestro test .maestro/screenshots -e EMAIL=demo@example.com -e PASSWORD=...
appId: com.com2go.dietbuddy
---
- launchApp:
    clearState: true
- tapOn: 'I already have an account'
- tapOn: 'alex@example.com'
- inputText: ${EMAIL}
- tapOn:
    id: 'Password'
- inputText: ${PASSWORD}
- hideKeyboard
# The first "Sign In" is the Sign In / Sign Up switch; the second is the button.
- tapOn:
    text: 'Sign In'
    index: 1
- assertVisible: 'Today’s Nutrition'
- takeScreenshot: 01-home
- tapOn:
    id: 'Meals'
- assertVisible: 'Calories Today'
- takeScreenshot: 02-meals
- tapOn:
    id: 'Coach'
- takeScreenshot: 03-coach
- tapOn:
    id: 'Progress'
- assertVisible: 'Weight Trend'
- takeScreenshot: 04-progress
- tapOn: 'Body'
- tapOn: 'Your Digital Twin.*'
- tapOn: 'Goal.*'
- takeScreenshot: 05-digital-twin
- tapOn: 'Close'
- tapOn: 'Overview'
- tapOn: '📸 Share your week'
- takeScreenshot: 06-weekly-story
